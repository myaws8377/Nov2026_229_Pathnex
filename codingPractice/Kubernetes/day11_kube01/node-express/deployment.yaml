apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotcup-express
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hotcup-express
  template:
    metadata:
      labels:
        app: hotcup-express
    spec:
      containers:
      - name: hotcup-express
        image: node:24-bookworm-slim
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory : "256Mi"
            cpu: "500m"
