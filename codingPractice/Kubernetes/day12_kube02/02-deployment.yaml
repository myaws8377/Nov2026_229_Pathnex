apiVersion: apps/v1
kind: Deployment

metadata:
  name: hotcup-express-deploy

spec:
  replicas: 3

  selector:
    matchLabels:
      app: hotcup-express-deploy

  template:
    metadata:
      labels:
        app: hotcup-express-deploy
    
    spec:
      containers:
        - name: hotcup-express
          image: hotcup-express:1.0
          imagePullPolicy: IfNotPresent

          ports:
           - containerPort: 3000

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "500m"
